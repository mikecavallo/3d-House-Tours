<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steinmann Depth Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/*SHARED_CSS*/
/* Layout: a pinned stage of five chapters. Each photo is a small 3D scene that turns with the pointer;
   between chapters the next photo assembles from the far wall forward along a scan line.
   Chapter list runs down the right edge; the caption sits lower left. */
.story{position:relative;height:1150vh;background:var(--stage)}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--stage);color:var(--on-stage)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(5,10,9,.72) 0%,rgba(5,10,9,.2) 36%,transparent 56%),linear-gradient(90deg,rgba(5,10,9,.42),transparent 48%)}
.cap{position:absolute;left:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(44px,9vh,96px));max-width:min(600px,calc(100% - 2*var(--gutter)))}
.cap .eyebrow{margin:0 0 12px;font:500 12px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#7FE3D0}
.cap h2{margin:0;font-weight:800;font-stretch:118%;font-size:clamp(36px,5.4vw,78px);line-height:.94;letter-spacing:-.02em;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.cap p{margin:14px 0 0;font:400 clamp(18px,1.6vw,21px)/1.45 var(--prose);color:var(--on-stage-dim);max-width:40ch}
.cap .facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:18px 0 0;padding:0;list-style:none;font:500 13px/1.2 var(--mono);letter-spacing:.04em;color:var(--on-stage-dim)}
.cap .facts .price{font:700 26px/1 var(--display);color:var(--on-stage)}
.cap .facts b{color:var(--on-stage)}
.cap .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.cap .acts .btn{background:#4FC4C6;color:#06201F}
.cap .acts .ghost{background:transparent;color:var(--on-stage);border:1px solid rgba(244,247,246,.5)}
.cap .in{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.chapters{position:absolute;right:var(--gutter);top:50%;transform:translateY(-50%);margin:0;padding:0;list-style:none;display:grid;gap:11px;justify-items:end}
.chapters{padding:16px 14px 16px 22px;border-radius:4px;background:rgba(6,12,11,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chapters li{display:flex;align-items:center;gap:12px;font:500 11.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(244,247,246,.62);cursor:pointer}
.chapters li i{width:18px;height:2px;background:currentColor;border-radius:2px;transition:width .4s}
.chapters li.on{color:var(--on-stage)}
.chapters li.on i{width:42px;background:#7FE3D0}
.chapters li:focus-visible{outline:2px solid #7FE3D0;outline-offset:4px}
.drag{position:absolute;right:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(44px,9vh,96px));font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(244,247,246,.6);text-align:right}
@media (max-width:760px){ .chapters{top:calc(env(safe-area-inset-top,0px) + 84px);transform:none;gap:10px} .chapters li span{display:none} .drag{display:none} }
</style>
</head>
<body>
<header class="bar">
  <a class="logo" href="#top" aria-label="Independent Realty Group"><img src="media/logo.png" alt="Independent Realty Group" width="100" height="37"></a>
  <button class="chip" id="snd" type="button" aria-pressed="false"><span class="dot"></span><span class="lbl">Sound on!</span></button>
  <a class="btn" href="#showing">Book a showing</a>
</header>

<section class="story" id="top" aria-label="106 Steinmann Avenue in ten scenes">
  <div class="stage">
    <img class="fallback" src="media/front2.jpg" alt="Front of 106 Steinmann Avenue">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="scrim"></div>
    <div class="cap" id="cap" aria-live="polite"></div>
    <ol class="chapters" id="chapters" aria-label="Chapters"></ol>
    <p class="drag" id="drag">Move to look around</p>
  </div>
</section>

<!--LISTING-->

<!--SCRIPTS-->
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const clamp01 = x => Math.max(0, Math.min(1, x));
const smooth = x => { x = clamp01(x); return x*x*(3 - 2*x); };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const P = DepthCam.P3;

const CH = [
  {scene: "front2", name: "Arrival", look: P(48, 50, 0.45), push: 0.32, zoom: 1.14, orbit: 0.07,
   html: `<p class="eyebrow">New listing · Middlebury, CT</p><h2>106 Steinmann Avenue</h2><p>A New England Cape on 0.39 acres, set back on a lawn ringed by mature pines.</p><ul class="facts"><li class="price">$439,900</li><li><b>4</b> bd</li><li><b>2</b> ba</li><li><b>1,630</b> sq ft</li></ul>`},
  {scene: "fireplace", name: "Fireplace", look: P(50, 51, 0.5), look2: P(43, 59, 0.6), push: 0.4, zoom: 1.1, orbit: 0.05,
   html: `<p class="eyebrow">Living room</p><h2>A real brick fireplace.</h2><p>A white mantel with fluted pilasters, built-in shelves on one side, and oak floors running the length of the room.</p>`},
  {scene: "living", name: "Dining", look: P(44, 50, 0.36), push: 0.5, zoom: 1.14, orbit: 0.07,
   html: `<p class="eyebrow">Main level</p><h2>A straight line to the kitchen.</h2><p>Past the stairs, the dining area opens onto a big kitchen with tile floors and the door to the deck.</p>`},
  {scene: "kitchen2", name: "Kitchen", look: P(50, 52, 0.66), push: 0.4, zoom: 1.05, orbit: 0.07,
   html: `<p class="eyebrow">Kitchen</p><h2>Cabinets all the way up.</h2><p>White cabinets to the ceiling, a full-height pantry, dark counters and a window over the sink.</p>`},
  {scene: "bath1", name: "Main bath", look: P(45, 45, 0.5), push: 0.3, zoom: 1.3, orbit: 0.05,
   html: `<p class="eyebrow">Main level · renovated</p><h2>A fresh full bath.</h2><p>A quartz-top vanity, marble-look tile, and a tub with shower, with a window out to the yard.</p>`},
  {scene: "primary2", name: "Primary", look: P(47, 56, 0.47), push: 0.35, zoom: 1.08, orbit: 0.07,
   html: `<p class="eyebrow">Upstairs</p><h2>A vaulted primary suite.</h2><p>Vaulted ceiling, octagon window, a big closet, and a slider out to a private balcony.</p>`},
  {scene: "bed2", name: "Blue room", look: P(50, 52, 0.56), push: 0.35, zoom: 1.08, orbit: 0.07,
   html: `<p class="eyebrow">Upstairs</p><h2>Another vaulted bedroom.</h2><p>Windows on two walls, an octagon window, built-in shelves and hardwood floors.</p>`},
  {scene: "deckgazebo", name: "Deck", look: P(50, 50, 0.56), push: 0.4, zoom: 1.08, orbit: 0.06,
   html: `<p class="eyebrow">Off the kitchen</p><h2>Dinner outside, all summer.</h2><p>A big wood deck with room to eat and lounge, looking out over the lawn.</p>`},
  {scene: "back", name: "Backyard", look: P(50, 46, 0.34), push: 0.36, zoom: 1.14, orbit: 0.07,
   html: `<p class="eyebrow">0.39 acres</p><h2>A level, landscaped yard.</h2><p>Rose of Sharon along the side, lawn to the tree line, and the primary bedroom's balcony looking over it all.</p>`},
  {scene: "front", name: "See it", look: P(50, 47, 0.45), push: 0.3, zoom: 1.14, orbit: 0.07,
   html: `<p class="eyebrow">Private showings this week</p><h2>Come see it in person.</h2><ul class="facts"><li class="price">$439,900</li><li>Taxes <b>$7,968</b>/yr</li><li>No HOA</li></ul><div class="acts"><a class="btn" href="#showing">Book a showing</a><a class="btn ghost" href="#details">Listing details</a></div>`}
];
const N = CH.length;

/* scan transition: the incoming photo appears where the scan front has passed, far surfaces first */
const STORY_FS = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uA, uB;
uniform float uMix, uTime, uGrain;
uniform vec2 uRes;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)))*43758.5453); }
void main(){
  vec4 a = texture(uA, v), b = texture(uB, v);
  float x = uMix;
  float th = 0.08 + 0.78*b.a + 0.04*(hash(floor(v*uRes/3.0)) - 0.5);
  float w = 0.05;
  float k = smoothstep(th - w, th, x*1.06);
  float edge = (1.0 - abs(x*1.06 - th)/w);
  edge = clamp(edge, 0.0, 1.0)*step(0.001, x)*step(x, 0.999);
  vec3 c = mix(a.rgb, b.rgb, k);
  c += vec3(0.50, 0.95, 0.86)*pow(edge, 3.0)*0.85;
  vec2 q = v - 0.5;
  c *= 1.0 - 0.3*dot(q, q)*1.6;
  c += (hash(v*uRes + fract(uTime)*91.0) - 0.5)*uGrain;
  o = vec4(c, 1.0);
}`;

const list = $("chapters");
CH.forEach((c, i) => list.insertAdjacentHTML("beforeend", `<li tabindex="0" data-i="${i}"><span>${c.name}</span><i></i></li>`));
const items = [...list.children];
const sec = document.querySelector(".story");
const scrollP = () => { const r = sec.getBoundingClientRect(); return clamp01(-r.top/(r.height - innerHeight)); };
const goTo = i => window.scrollTo({top: sec.offsetTop + (i/(N - 1))*(sec.offsetHeight - innerHeight), behavior: reduce ? "auto" : "smooth"});
items.forEach(li => { li.addEventListener("click", () => goTo(+li.dataset.i)); li.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); goTo(+li.dataset.i); } }); });

let cur = -1;
function ui(p){
  const f = p*(N - 1), i = Math.min(N - 1, Math.round(f));
  if (i !== cur){ cur = i; $("cap").innerHTML = `<div class="in">${CH[i].html}</div>`; items.forEach((li, k) => li.classList.toggle("on", k === i)); }
}

const audio = new Audio("media/birds.mp3"); audio.loop = true; audio.volume = 0.5;
let soundOn = false;
$("snd").addEventListener("click", () => {
  soundOn = !soundOn; $("snd").setAttribute("aria-pressed", String(soundOn));
  $("snd").querySelector(".lbl").textContent = soundOn ? "Sound off" : "Sound on!";
  if (soundOn) audio.play().catch(() => {}); else audio.pause();
});
let mx = 0, my = 0, tmx = 0, tmy = 0, lastMove = -1e9;
addEventListener("pointermove", e => { tmx = e.clientX/innerWidth*2 - 1; tmy = e.clientY/innerHeight*2 - 1; lastMove = performance.now(); });

function cam(k, local, time, mxv, myv){
  const c = CH[k];
  const e = smooth(local), z = c.push*e;
  const drift = reduce ? 0 : 1, o = c.orbit;
  const ox = mxv*o + drift*o*0.3*Math.sin(time*0.3 + k), oy = -myv*o*0.5 + drift*o*0.18*Math.sin(time*0.23 + k);
  const pos = [ox, oy, z - 0.04];
  const look = c.look2 ? c.look.map((v, i) => v + (c.look2[i] - v)*e) : c.look;
  const [yaw, pitch] = DepthCam.aim(pos, look);
  return {pos, yaw, pitch, roll: -mxv*0.008, zoom: c.zoom};
}

const cv = $("gl");
const eng = DepthCam.create(cv, {compFS: STORY_FS, maxPixels: 2.4e6});
let shown = scrollP();
window.__story = {lock: null, set(p){ this.lock = shown = p; }};
ui(shown);
if (!eng){ cv.remove(); window.__ready = true; return; }
/* MEDIA:front2.jpg MEDIA:front2-depth.png MEDIA:fireplace.jpg MEDIA:fireplace-depth.png MEDIA:living.jpg MEDIA:living-depth.png MEDIA:kitchen2.jpg MEDIA:kitchen2-depth.png MEDIA:bath1.jpg MEDIA:bath1-depth.png MEDIA:primary2.jpg MEDIA:primary2-depth.png MEDIA:bed2.jpg MEDIA:bed2-depth.png MEDIA:deckgazebo.jpg MEDIA:deckgazebo-depth.png MEDIA:back.jpg MEDIA:back-depth.png MEDIA:front.jpg MEDIA:front-depth.png */
const names = [...new Set(CH.map(c => c.scene))];
Promise.all(names.map(n => eng.add(n, `media/${n}.jpg`, `media/${n}-depth.png`))).then(() => {
  document.querySelector(".fallback").hidden = true;
  const t0 = performance.now();
  function tick(now){
    const target = window.__story.lock != null ? window.__story.lock : scrollP();
    shown += (target - shown)*(reduce ? 1 : 0.085);
    const time = (now - t0)/1000;
    /* no pointer for a while (or a phone): drift on our own */
    const idle = now - lastMove > 2500;
    const ax = idle ? Math.sin(time*0.35)*0.55 : tmx, ay = idle ? Math.sin(time*0.27)*0.3 : tmy;
    mx += (ax - mx)*0.04; my += (ay - my)*0.04;
    const f = shown*(N - 1), k = Math.min(N - 2, Math.floor(f)), x = f - k;
    /* hold each chapter, then scan to the next over the last 45% of the stretch */
    const m = smooth((x - 0.55)/0.45);
    const A = cam(k, x, time, mx, my), B = cam(k + 1, Math.max(0, x - 0.55)/0.45*0.15, time, mx, my);
    if (m <= 0.0001) eng.render({a: {scene: CH[k].scene, cam: A}, b: {scene: CH[k].scene, cam: A}, mix: 0, time, uniforms: {uMix: 0, uTime: time, uGrain: 0.03}});
    else eng.render({a: {scene: CH[k].scene, cam: A}, b: {scene: CH[k + 1].scene, cam: B}, mix: m, time, uniforms: {uMix: m, uTime: time, uGrain: 0.03}});
    ui(shown);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  window.__ready = true;
}).catch(e => { console.error(e); cv.remove(); window.__ready = true; });
})();
</script>
</body>
</html>
