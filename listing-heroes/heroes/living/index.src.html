<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steinmann Living Photo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/*SHARED_CSS*/
/* Layout: one full-bleed photo that is quietly alive (clouds cross, leaves move, the gazebo curtains
   lift in the breeze) with the listing card over it and the listing page below. */
.hero{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;background:var(--stage);color:var(--on-stage)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(5,10,9,.7) 0%,rgba(5,10,9,.16) 34%,transparent 52%),linear-gradient(90deg,rgba(5,10,9,.32),transparent 42%)}
.card{position:absolute;left:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(40px,8vh,84px))}
.card .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.card .btn{background:#4FC4C6;color:#06201F}
.card .ghost{background:transparent;color:var(--on-stage);border:1px solid rgba(244,247,246,.5)}
.live{position:absolute;right:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(40px,8vh,84px));display:grid;gap:10px;justify-items:end;text-align:right}
.live .badge{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--on-stage)}
.live .badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#5FE0C8;box-shadow:0 0 0 0 rgba(95,224,200,.6);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,224,200,.55)}80%,100%{box-shadow:0 0 0 12px rgba(95,224,200,0)}}
.live p{margin:0;font:400 italic 16px/1.4 var(--prose);color:var(--on-stage-dim);max-width:30ch}
.live .wind{display:flex;gap:6px;align-items:center;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--on-stage-dim)}
.live .wind input{accent-color:#5FE0C8;width:110px}
@media (max-width:760px){ .live{left:var(--gutter);right:auto;justify-items:start;text-align:left;top:calc(env(safe-area-inset-top,0px) + 80px);bottom:auto} .live p{display:none} }
</style>
</head>
<body>
<header class="bar">
  <a class="logo" href="#top" aria-label="Independent Realty Group"><img src="media/logo.png" alt="Independent Realty Group" width="100" height="37"></a>
  <button class="chip" id="snd" type="button" aria-pressed="false"><span class="dot"></span><span class="lbl">Sound on!</span></button>
  <a class="btn" href="#showing">Book a showing</a>
</header>

<section class="hero" id="top" aria-label="The backyard at 106 Steinmann Avenue">
  <img class="fallback" src="media/back.jpg" alt="The rear of 106 Steinmann Avenue with the deck and backyard">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="scrim"></div>
  <div class="card">
    <p class="eyebrow"><i></i>New listing · Middlebury, CT</p>
    <h1>106 Steinmann Avenue</h1>
    <p class="town">A New England Cape on 0.39 acres</p>
    <ul class="facts"><li class="price">$439,900</li><li><b>4</b> bd</li><li><b>2</b> ba</li><li><b>1,630</b> sq ft</li></ul>
    <div class="acts"><a class="btn" href="#showing">Book a showing</a><a class="btn ghost" href="#details">Listing details</a></div>
  </div>
  <div class="live">
    <span class="badge">Living photo</span>
    <p>The backyard on a breezy summer afternoon, from the far edge of the lawn.</p>
    <label class="wind" for="wind">Breeze <input id="wind" type="range" min="0" max="2" step="0.05" value="1"></label>
  </div>
</section>

<!--LISTING-->

<!--SCRIPTS-->
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const LIVE_FS = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uA, uB, uCloud;
uniform float uTime, uGrain, uWind;
uniform vec4 uView;   /* view aspect, cover, zoom, image aspect */
uniform vec2 uRes;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)))*43758.5453); }
vec2 imgUV(vec2 p){ vec2 s = (p*2.0 - 1.0)*vec2(uView.x, 1.0)*uView.y; vec2 q = s/uView.z; return vec2(q.x/uView.w, q.y)*0.5 + 0.5; }
void main(){
  float t = uTime;
  vec3 M = texture(uB, v).rgb;      /* r sky, g foliage, b curtains */
  float gust = uWind*(0.65 + 0.35*sin(t*0.23)*sin(t*0.37 + 1.0));
  vec2 off = vec2(0.0);
  off.x += M.g*(sin(t*1.25 + v.y*14.0 + v.x*5.0)*0.0016 + sin(t*2.3 + v.x*31.0 + v.y*9.0)*0.0006)*gust;
  off.y += M.g*sin(t*1.7 + v.x*11.0 + v.y*4.0)*0.0005*gust;
  off.x += M.b*(sin(t*1.4 + v.x*38.0)*0.0030 + sin(t*0.8 + v.x*13.0)*0.0018)*gust;
  off.y += M.b*sin(t*1.1 + v.x*21.0)*0.0011*gust;
  vec3 c = texture(uA, v + off).rgb;
  /* clouds drift right to left across the sky */
  vec2 iu = imgUV(v);
  vec2 pu = vec2((iu.x - 0.20)/0.52 + t*0.0045*(0.6 + 0.4*uWind), 1.0 - (1.0 - iu.y)/0.225);
  pu.x += 0.006*sin(t*0.07 + pu.y*4.0);
  vec3 cl = texture(uCloud, pu).rgb;
  c = mix(c, cl, clamp(M.r, 0.0, 1.0));
  /* soft cloud shadows sliding over the yard and the house */
  float n = (sin((iu.x*1.7 - t*0.016)*6.2832)*0.5 + 0.5)*(sin((iu.x*1.1 + iu.y*0.9 - t*0.010)*6.2832)*0.5 + 0.5);
  c *= 1.0 - 0.08*smoothstep(0.3, 0.85, n)*(1.0 - M.r);
  vec2 q = v - 0.5;
  c *= 1.0 - 0.2*dot(q, q)*1.6;
  c += (hash(v*uRes + fract(t)*91.0) - 0.5)*uGrain;
  o = vec4(c, 1.0);
}`;

const audio = new Audio("media/birds.mp3"); audio.loop = true; audio.volume = 0.55;
let soundOn = false;
$("snd").addEventListener("click", () => {
  soundOn = !soundOn; $("snd").setAttribute("aria-pressed", String(soundOn));
  $("snd").querySelector(".lbl").textContent = soundOn ? "Sound off" : "Sound on!";
  if (soundOn) audio.play().catch(() => {}); else audio.pause();
});
let wind = 1; $("wind").addEventListener("input", e => { wind = +e.target.value; });
let mx = 0, my = 0, tmx = 0, tmy = 0;
addEventListener("pointermove", e => { tmx = e.clientX/innerWidth*2 - 1; tmy = e.clientY/innerHeight*2 - 1; });

const cv = $("gl"), hero = document.querySelector(".hero");
const eng = DepthCam.create(cv, {compFS: LIVE_FS, maxPixels: 2.4e6});
window.__live = {time: null};
if (!eng){ cv.remove(); window.__ready = true; return; }
Promise.all([eng.add("photo", "media/back.jpg", "media/back-depth.png"), eng.add("mask", "media/back-motion.png", "media/back-depth.png"), eng.addTex("cloud", "media/back-clouds.jpg", "mirror")]).then(() => {
  document.querySelector(".fallback").hidden = true;
  const t0 = performance.now();
  let visible = true;
  new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(hero);
  function tick(now){
    requestAnimationFrame(tick);
    if (!visible) return;
    const time = window.__live.time != null ? window.__live.time : (reduce ? 0 : (now - t0)/1000);
    mx += (tmx - mx)*0.035; my += (tmy - my)*0.035;
    const sc = Math.min(1, Math.max(0, scrollY/innerHeight));
    const zoom = 1.05;
    const cam = {pos: [0.02*Math.sin(time*0.09) + mx*0.03, 0.01*Math.sin(time*0.07) - my*0.015, 0.04 + 0.03*Math.sin(time*0.12) + sc*0.25], yaw: -mx*0.01, pitch: 0.02 + my*0.006, roll: 0, zoom};
    const va = cv.clientWidth/cv.clientHeight, asp = eng.scenes.photo.asp;
    eng.render({a: {scene: "photo", cam}, b: {scene: "mask", cam}, time, tex: {uCloud: "cloud"}, uniforms: {uTime: time, uGrain: 0.03, uWind: reduce ? 0 : wind, uView: [va, Math.min(1, asp/va), zoom, asp]}});
    if (soundOn) audio.volume = 0.55*(1 - sc*0.8);
  }
  requestAnimationFrame(tick);
  window.__ready = true;
}).catch(e => { console.error(e); cv.remove(); window.__ready = true; });
})();
</script>
</body>
</html>
