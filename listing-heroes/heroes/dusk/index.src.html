<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steinmann at Dusk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/*SHARED_CSS*/
/* Layout: a pinned stage where scrolling is the clock. The afternoon listing photo runs through golden
   hour and sunset to blue hour, and the windows come on one by one. Clock and sun track along the bottom. */
.dusk{position:relative;height:520vh;background:var(--stage)}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--stage);color:var(--on-stage)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(4,8,12,.78) 0%,rgba(4,8,12,.3) 30%,transparent 52%),linear-gradient(90deg,rgba(4,8,12,.4) 0%,transparent 40%)}
.card{position:absolute;left:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
.clock{position:absolute;right:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);text-align:right;color:var(--on-stage)}
.clock .t{display:block;font-weight:300;font-stretch:72%;font-size:clamp(56px,9vw,128px);line-height:.86;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.clock .t small{font-size:.32em;font-weight:500;font-stretch:100%;letter-spacing:.04em;margin-left:.15em;vertical-align:.2em}
.clock .ph{display:block;margin-top:10px;font:500 12px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#FFC98F}
/* the sun track: a day strip from early afternoon to after dark */
.track{position:absolute;left:var(--gutter);right:var(--gutter);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);height:84px}
.track .rail{position:absolute;left:0;right:0;top:48px;height:2px;border-radius:2px;background:linear-gradient(90deg,#9FC6E8 0%,#F2D9A6 42%,#FF9C5B 58%,#5B4F8E 80%,#141B33 100%)}
.track .tick{position:absolute;top:40px;width:1px;height:18px;background:rgba(244,247,246,.5)}
.track .tl{position:absolute;top:66px;transform:translateX(-50%);font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(244,247,246,.68);white-space:nowrap}
.track .tl.end{transform:translateX(-100%)}
.track .tl.start{transform:none}
.knob{position:absolute;top:31px;width:36px;height:36px;margin-left:-18px;border-radius:50%;border:0;padding:0;cursor:grab;touch-action:none;
  background:radial-gradient(circle at 50% 50%,#FFF6DE 0 30%,#FFD27A 31% 46%,rgba(255,200,110,.0) 47%);box-shadow:0 0 30px 6px rgba(255,190,90,.45)}
.knob.moon{background:radial-gradient(circle at 42% 42%,#F2F4FF 0 34%,rgba(220,226,255,0) 36%);box-shadow:0 0 26px 4px rgba(170,185,255,.35)}
.knob:focus-visible{outline:2px solid #fff;outline-offset:4px}
.play{position:absolute;left:0;top:0}
.play .chip{height:32px}
@media (max-width:700px){
  .clock{left:var(--gutter);right:auto;text-align:left;top:calc(env(safe-area-inset-top,0px) + 80px);bottom:auto}
  .card{bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
  .track .tl.mid{display:none}
}
</style>
</head>
<body>
<header class="bar">
  <a class="logo" href="#top" aria-label="Independent Realty Group"><img src="media/logo.png" alt="Independent Realty Group" width="100" height="37"></a>
  <button class="chip" id="snd" type="button" aria-pressed="false"><span class="dot"></span><span class="lbl">Sound on!</span></button>
  <a class="btn" href="#showing">Book a showing</a>
</header>

<section class="dusk" id="top" aria-label="106 Steinmann Avenue from afternoon to dusk">
  <div class="stage">
    <img class="fallback" src="media/front2.jpg" alt="Front of 106 Steinmann Avenue">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="scrim"></div>
    <div class="card">
      <p class="eyebrow"><i></i>New listing · Middlebury, CT</p>
      <h1>106 Steinmann Avenue</h1>
      <p class="town">Scroll to watch the evening come in.</p>
      <ul class="facts"><li class="price">$439,900</li><li><b>4</b> bd</li><li><b>2</b> ba</li><li><b>1,630</b> sq ft</li></ul>
    </div>
    <div class="clock" aria-live="off"><span class="t" id="clock">2:10<small>PM</small></span><span class="ph" id="phase">Listing photo</span></div>
    <div class="track" id="track">
      <div class="play"><button class="chip" id="play" type="button"><span class="dot"></span>Play the sunset</button></div>
      <div class="rail"></div>
      <button class="knob" id="knob" type="button" role="slider" aria-label="Time of day" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></button>
    </div>
  </div>
</section>

<!--LISTING-->

<!--SCRIPTS-->
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const clamp01 = x => Math.max(0, Math.min(1, x));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* the clock: scroll position -> minutes after midnight. Sunset in Middlebury in early October is about 6:29 pm. */
const CLOCK = [[0, 14*60 + 10], [0.3, 17*60 + 35], [0.55, 18*60 + 29], [0.8, 18*60 + 56], [1, 19*60 + 25]];
const PHASES = [[0, "Listing photo"], [0.16, "Late afternoon"], [0.34, "Golden hour"], [0.5, "Sunset · 6:29 pm"], [0.63, "Lights on"], [0.76, "Blue hour"], [0.93, "Evening"]];
function minutes(t){ for (let i = 1; i < CLOCK.length; i++){ const [a, ma] = CLOCK[i - 1], [b, mb] = CLOCK[i]; if (t <= b) return ma + (mb - ma)*(t - a)/(b - a); } return CLOCK[CLOCK.length - 1][1]; }
function fmt(m){ m = Math.round(m); let h = Math.floor(m/60), mm = m%60; const pm = h >= 12; h = h%12 || 12; return [h + ":" + String(mm).padStart(2, "0"), pm ? "PM" : "AM"]; }

const track = $("track");
[[0, "2 pm", "start"], [CLOCK[1][0], "5:30", "mid"], [0.55, "Sunset", ""], [0.8, "Blue hour", "mid"], [1, "7:25", "end"]].forEach(([t, l, c]) => {
  track.insertAdjacentHTML("beforeend", `<span class="tick" style="left:${t*100}%"></span><span class="tl ${c}" style="left:${t*100}%">${l}</span>`);
});

const DUSK_FS = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uA, uB;
uniform float uT, uTime, uGrain;
uniform vec2 uRes;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)))*43758.5453); }
void main(){
  vec4 A = texture(uA, v); vec3 c = A.rgb; float d = A.a;
  vec3 M = texture(uB, v).rgb; float sky = M.r, win = M.g, spill = M.b;
  float t = uT;
  float L = dot(c, vec3(0.299, 0.587, 0.114));
  float gold = smoothstep(0.1, 0.4, t)*(1.0 - smoothstep(0.48, 0.66, t));
  float dusk = smoothstep(0.42, 0.84, t);
  float night = smoothstep(0.82, 1.0, t);
  /* golden hour: warm, low light, a sun glow from the upper left */
  vec3 g = c*vec3(1.13, 0.99, 0.80);
  g += vec3(0.20, 0.11, 0.02)*smoothstep(1.2, 0.0, length((v - vec2(-0.05, 1.05))*vec2(1.0, 1.4)))*(1.0 - sky);
  c = mix(c, g, gold);
  c *= 1.0 - 0.18*smoothstep(0.3, 0.55, t);
  /* dusk: cool, low saturation, distant trees fall to silhouette first */
  vec3 cool = mix(vec3(L), c, 0.6)*vec3(0.60, 0.70, 1.0);
  float expo = mix(1.0, mix(0.34, 0.2, night), dusk);
  expo *= mix(1.0, mix(0.5, 1.12, smoothstep(0.08, 0.55, d)), dusk);
  c = mix(c, cool, dusk)*expo;
  /* sky: afternoon haze -> peach at the horizon under a deepening blue, stars after dark */
  float sy = clamp(v.y*1.15 - 0.15, 0.0, 1.0);
  vec3 top = mix(vec3(0.50, 0.66, 0.86), vec3(0.11, 0.17, 0.36), smoothstep(0.38, 0.85, t));
  top = mix(top, vec3(0.03, 0.04, 0.10), night);
  vec3 low = mix(vec3(0.90, 0.90, 0.88), vec3(1.0, 0.66, 0.42), smoothstep(0.28, 0.6, t));
  low = mix(low, vec3(0.56, 0.36, 0.48), smoothstep(0.66, 0.9, t));
  low = mix(low, vec3(0.10, 0.09, 0.18), night);
  vec3 sc = mix(low, top, pow(sy, 0.8));
  sc *= 0.9 + 0.2*L;
  vec2 sp = floor(v*uRes/2.0);
  float star = step(0.9965, hash(sp))*(0.6 + 0.4*sin(uTime*2.0 + hash(sp + 3.1)*30.0))*night;
  sc += vec3(star);
  c = mix(c, sc, sky*smoothstep(0.18, 0.5, t));
  /* lights come on left to right: porch lamp and door first, then the bay, then the upstairs */
  float on = smoothstep(0.56 + 0.09*v.x, 0.6 + 0.09*v.x, t);
  vec3 warm = vec3(1.0, 0.68, 0.38);
  vec3 interior = warm*(0.55 + 1.35*L)*1.65;
  c = mix(c, interior, clamp(win, 0.0, 1.0)*on*0.96);
  c += warm*spill*on*mix(0.18, 0.62, dusk);
  vec2 q = v - 0.5;
  c *= 1.0 - (0.25 + 0.3*dusk)*dot(q, q)*1.6;
  c += (hash(v*uRes + fract(uTime)*91.0) - 0.5)*uGrain;
  o = vec4(c, 1.0);
}`;

const sec = document.querySelector(".dusk");
const scrollT = () => { const r = sec.getBoundingClientRect(); return clamp01(-r.top/(r.height - innerHeight)); };
const setScrollT = t => window.scrollTo({top: sec.offsetTop + t*(sec.offsetHeight - innerHeight)});
let shown = scrollT();
let lastPh = "";
function ui(t){
  const [hm, ap] = fmt(minutes(t));
  $("clock").innerHTML = hm + "<small>" + ap + "</small>";
  let ph = PHASES[0][1]; PHASES.forEach(([a, l]) => { if (t >= a) ph = l; });
  if (ph !== lastPh){ $("phase").textContent = ph; lastPh = ph; }
  const k = $("knob"); k.style.left = (t*100) + "%"; k.setAttribute("aria-valuenow", String(Math.round(t*100))); k.setAttribute("aria-valuetext", hm + " " + ap);
  k.classList.toggle("moon", t > 0.72);
}

/* drag the sun along the track (moves the page, so scroll stays the one source of truth) */
(function(){
  const k = $("knob"); let drag = false;
  const at = e => { const r = track.getBoundingClientRect(); return clamp01((e.clientX - r.left)/r.width); };
  k.addEventListener("pointerdown", e => { drag = true; k.setPointerCapture(e.pointerId); stopPlay(); });
  k.addEventListener("pointermove", e => { if (drag) setScrollT(at(e)); });
  k.addEventListener("pointerup", () => { drag = false; });
  k.addEventListener("keydown", e => {
    const step = e.shiftKey ? 0.1 : 0.02;
    if (e.key === "ArrowRight" || e.key === "ArrowUp"){ setScrollT(clamp01(scrollT() + step)); e.preventDefault(); }
    if (e.key === "ArrowLeft" || e.key === "ArrowDown"){ setScrollT(clamp01(scrollT() - step)); e.preventDefault(); }
  });
})();
let playing = null;
function stopPlay(){ if (playing){ cancelAnimationFrame(playing); playing = null; $("play").lastChild.textContent = "Play the sunset"; } }
$("play").addEventListener("click", () => {
  if (playing){ stopPlay(); return; }
  const from = scrollT() > 0.97 ? 0 : scrollT(), dur = 9000*(1 - from), t0 = performance.now();
  $("play").lastChild.textContent = "Pause";
  const step = now => { const x = clamp01((now - t0)/dur); setScrollT(from + (1 - from)*x); if (x < 1) playing = requestAnimationFrame(step); else stopPlay(); };
  playing = requestAnimationFrame(step);
});
addEventListener("wheel", stopPlay, {passive: true}); addEventListener("touchstart", stopPlay, {passive: true});

/* evening sound: birds fade out as the light goes */
const audio = new Audio("media/birds.mp3"); audio.loop = true; audio.volume = 0;
let soundOn = false;
$("snd").addEventListener("click", () => {
  soundOn = !soundOn; $("snd").setAttribute("aria-pressed", String(soundOn));
  $("snd").querySelector(".lbl").textContent = soundOn ? "Sound off" : "Sound on!";
  if (soundOn) audio.play().catch(() => {}); else audio.pause();
});

/* pointer parallax */
let mx = 0, my = 0, tmx = 0, tmy = 0;
addEventListener("pointermove", e => { tmx = e.clientX/innerWidth*2 - 1; tmy = e.clientY/innerHeight*2 - 1; });

const cv = $("gl");
const eng = DepthCam.create(cv, {compFS: DUSK_FS, maxPixels: 2.4e6});
window.__dusk = {lock: null, set(t){ this.lock = shown = t; }};
ui(shown);
if (!eng){ cv.remove(); window.__ready = true; return; }
Promise.all([eng.add("photo", "media/front2.jpg", "media/front2-depth.png"), eng.add("mask", "media/front2-mask.png", "media/front2-depth.png")]).then(() => {
  document.querySelector(".fallback").hidden = true;
  const t0 = performance.now();
  function tick(now){
    const target = window.__dusk.lock != null ? window.__dusk.lock : scrollT();
    shown += (target - shown)*(reduce ? 1 : 0.1);
    const time = (now - t0)/1000;
    mx += (tmx - mx)*0.04; my += (tmy - my)*0.04;
    const drift = reduce ? 0 : Math.sin(time*0.21);
    const cam = {pos: [mx*0.035 + drift*0.01 + 0.03, -my*0.02, 0.02 + 0.05*shown], yaw: -mx*0.012 + 0.012, pitch: 0.045 + my*0.008, roll: 0, zoom: 1.04};
    eng.render({a: {scene: "photo", cam}, b: {scene: "mask", cam}, time, uniforms: {uT: shown, uTime: time, uGrain: 0.03}});
    ui(shown);
    if (soundOn) audio.volume += ((0.55*(1 - clamp01((shown - 0.45)/0.4))) - audio.volume)*0.05;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  window.__ready = true;
}).catch(e => { console.error(e); cv.remove(); window.__ready = true; });
})();
</script>
</body>
</html>
